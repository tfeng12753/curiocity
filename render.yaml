services:
  - type: web
    name: curiocity
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The hand tracker needs the camera, which browsers only grant over HTTPS
      # to a page that is allowed to use it.
      - path: /*
        name: Permissions-Policy
        value: camera=(self)
    envVars:
      # Curio's narration is optional - leave unset and dialogue stays text-only.
      # NOTE: if this service was created by hand in the Render dashboard (not
      # via "New > Blueprint"), Render ignores this file entirely - set these
      # env vars and the header above directly in the dashboard instead.
      - key: VITE_API_ENDPOINT
        value: https://curiocity-voice.onrender.com/api

  # Holds ELEVENLABS_API_KEY and IFM_API_KEY server-side, proxying narration
  # and Curio's AI hints. See server/index.mjs - this is the one deliberate
  # exception to "no server".
  - type: web
    name: curiocity-voice
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: IFM_API_KEY
        sync: false
      - key: IFM_MODEL
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://curiocity-16y4.onrender.com
