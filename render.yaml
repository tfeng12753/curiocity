services:
  - type: web
    name: learnverse
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The hand tracker needs the camera, which browsers only grant over HTTPS
      # to a page that is allowed to use it.
      - path: /*
        name: Permissions-Policy
        value: camera=(self)
    envVars:
      # Poly's narration is optional - leave unset and dialogue stays text-only.
      - key: VITE_VOICE_ENDPOINT
        value: https://learnverse-voice.onrender.com/api

  # Holds ELEVENLABS_API_KEY server-side and proxies text-to-speech requests.
  # See server/index.mjs - this is the one deliberate exception to "no server".
  - type: web
    name: learnverse-voice
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://learnverse.onrender.com
